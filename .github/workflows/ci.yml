name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "markdown~=3.10" "pytest>=8" "ruff~=0.16"
      - run: ruff check plugin tests
      - run: ruff format --check plugin tests
      - run: pytest
