# Secret scanning with gitleaks on every push and pull request.
# Personal accounts need no license. Organisation repos need a GITLEAKS_LICENSE
# secret (free for small orgs; see gitleaks.io).
name: secret-scan
on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
