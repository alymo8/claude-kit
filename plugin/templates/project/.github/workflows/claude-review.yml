# AI code review on pull requests. DISABLED until credentials are configured.
#
# To enable:
#   1. Choose one auth method:
#      a) Run /install-github-app in Claude Code for this repo. It installs the
#         Claude GitHub App and stores CLAUDE_CODE_OAUTH_TOKEN as a repo secret.
#      b) Or add an ANTHROPIC_API_KEY repo secret and swap the `with:` lines below.
#   2. Replace `workflow_dispatch:` under `on:` with:
#        pull_request:
#          types: [opened, synchronize, reopened]
name: claude-review
on:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >
            Review this pull request for correctness bugs, missing tests, and
            quality problems. Post specific, actionable findings as PR comments.
